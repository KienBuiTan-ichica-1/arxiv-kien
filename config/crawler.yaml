schema_version: 1
range:
  start_month: '2024-10'
  start_id: 23025
  end_month: '2024-11'
  end_id: 3798
  monthly_end_ids:
    '2024-10': 24226
  # Range xuyên tháng: thêm monthly_end_ids cho tháng đầu và các tháng giữa.
  # Không dùng 99999 làm giới hạn giả định; xem README.
paths:
  persistent_root: runtime
  scratch_root: runtime/temp
network:
  discovery_batch_size: 50
  metadata_batch_size: 50
  s2_batch_size: 100
execution:
  allow_anonymous_s2: false
  progress_queue_capacity: 100
  s2_publish_queue_capacity: 8
  s2_publish_queue_bytes: 33554432  # Includes the active publication (32 MiB).
  s2_response_max_bytes: 8388608   # One extra response may await queue admission (8 MiB).
  s2_snapshot_max_bytes: 67108864  # Raw pages per version (64 MiB).
